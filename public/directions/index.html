<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Jackie Ng · moved to the homepage</title>
<meta http-equiv="refresh" content="0; url=../">
<link rel="canonical" href="https://grasswall.github.io/jackieng-profile/">
<script>
// The old direction board is now one scrolling homepage. Old #a/#b/#c links land on the matching chapter.
(function () {
  var map = { a: '#founder', b: '#evidence', c: '#work-index' };
  var h = (location.hash || '').replace('#', '');
  var base = location.pathname.replace(/directions\/?(index\.html)?$/, '');
  location.replace(base + (map[h] || ''));
})();
</script>
</head>
<body>
<p>The direction board is now part of the homepage. <a href="../">Open the homepage</a>.</p>
</body>
