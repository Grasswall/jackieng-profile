<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackie Ng</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <main>
    
    <!-- Hero: Massive, confident -->
    <section class="hero">
      <h1>Jackie Ng</h1>
      <p class="lead">I predict which drug delivery systems will work—then prove it in the lab.</p>
      <div class="facts">
        <span>20nm platform</span>
        <span>8× BBB transcytosis</span>
        <span>HK$7.3M funded</span>
      </div>
    </section>

    <!-- Visual 1: Size comparison (the ONE thing that matters) -->
    <section class="visual-section">
      <div class="container">
        <svg viewBox="0 0 800 400" class="size-comparison">
          <!-- 20nm AtomBios -->
          <g>
            <circle cx="100" cy="200" r="20" fill="#2a9d8f" opacity="0.9"/>
            <text x="100" y="260" text-anchor="middle" class="label">20nm</text>
            <text x="100" y="280" text-anchor="middle" class="sublabel">AtomBios</text>
          </g>
          
          <!-- 80nm LNP -->
          <g>
            <circle cx="300" cy="200" r="80" fill="#666" opacity="0.6"/>
            <text x="300" y="300" text-anchor="middle" class="label">80nm</text>
            <text x="300" y="320" text-anchor="middle" class="sublabel">Conventional LNP</text>
          </g>
          
          <!-- 100nm+ Virus -->
          <g>
            <circle cx="550" cy="200" r="100" fill="#444" opacity="0.4"/>
            <text x="550" y="320" text-anchor="middle" class="label">100nm+</text>
            <text x="550" y="340" text-anchor="middle" class="sublabel">Viral vector</text>
          </g>
          
          <!-- Arrow showing advantage -->
          <text x="100" y="120" text-anchor="middle" class="advantage">Crosses BBB</text>
          <line x1="100" y1="130" x2="100" y2="175" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrowhead)"/>
          
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
              <polygon points="0 0, 10 3, 0 6" fill="#2a9d8f"/>
            </marker>
          </defs>
        </svg>
      </div>
    </section>

    <!-- Proof: ONE beautiful image -->
    <section class="proof-section">
      <div class="container">
        <img src="assets/images/molecular-1.png" alt="Cryo-EM structure" class="proof-image">
        <p class="caption">2.7 Å resolution. Deposited in PDB.</p>
        <a href="https://doi.org/10.1016/j.jbc.2024.107390" class="link">Journal of Biological Chemistry →</a>
      </div>
    </section>

    <!-- Recognition: Just the essentials -->
    <section class="recognition-section">
      <div class="container">
        <div class="recognition-grid">
          <div class="recognition-item">
            <div class="number">HK$7.3M</div>
            <div class="label">Funded</div>
          </div>
          <div class="recognition-item">
            <div class="number">HKSTP</div>
            <div class="label">Incu-Bio</div>
          </div>
          <div class="recognition-item">
            <div class="number">Lindau</div>
            <div class="label">2025</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Contact: Simple -->
    <section class="contact-section">
      <div class="container">
        <p class="contact-line">jackie.ng@atombios.com</p>
      </div>
    </section>

  </main>

</body>
</html>
