  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-light:   #FDFCFA;
      --bg-dark:    #0a0a0a;
      --bg-dark2:   #111009;
      --gold:       #9d7e5a;
      --gold-light: #c4a882;
      --text:       #1a1614;
      --text-muted: #6b6460;
      --border:     rgba(26,22,20,0.06);
      --radius-card: 16px;
      --radius-pill: 100px;
      --shadow:     0 6px 32px rgba(0,0,0,0.05);
      --shadow-md:  0 12px 48px rgba(0,0,0,0.1);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-light);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* ─── Typography ────────────────────────────────────── */
    .serif { font-family: 'Cormorant Garamond', serif; }

    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; line-height: 1.15; }

    /* ─── Utilities ─────────────────────────────────────── */
    .section-tag {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(157,126,90,0.08);
      border: 1px solid rgba(157,126,90,0.2);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 20px;
    }

    .count-line {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 40px;
    }

    .count-line.dark { color: rgba(255,255,255,0.45); }

    /* ─── Badges ────────────────────────────────────────── */
    .badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .badge-gold    { background: rgba(157,126,90,0.12); color: var(--gold); border: 1px solid rgba(157,126,90,0.25); }
    .badge-won     { background: rgba(34,197,94,0.1);   color: #16a34a;     border: 1px solid rgba(34,197,94,0.2); }
    .badge-silver  { background: rgba(34,197,94,0.1);   color: #16a34a;     border: 1px solid rgba(34,197,94,0.2); }
    .badge-selected{ background: rgba(59,130,246,0.1);  color: #2563eb;     border: 1px solid rgba(59,130,246,0.2); }
    .badge-featured{ background: rgba(139,92,246,0.1);  color: #7c3aed;     border: 1px solid rgba(139,92,246,0.2); }
    .badge-published{ background: rgba(139,92,246,0.1); color: #7c3aed;     border: 1px solid rgba(139,92,246,0.2); }
    .badge-in-progress{ background: rgba(249,115,22,0.1); color: #ea580c;   border: 1px solid rgba(249,115,22,0.2); }
    .badge-first-class{ background: rgba(157,126,90,0.12); color: var(--gold); border: 1px solid rgba(157,126,90,0.25); }
    .badge-funded  { background: rgba(34,197,94,0.1);   color: #16a34a;     border: 1px solid rgba(34,197,94,0.2); }

    /* Dark section badge variants */
    .dark-section .badge-gold    { background: rgba(196,168,130,0.15); color: var(--gold-light); border-color: rgba(196,168,130,0.3); }
    .dark-section .badge-won     { background: rgba(74,222,128,0.12);  color: #4ade80;            border-color: rgba(74,222,128,0.25); }
    .dark-section .badge-silver  { background: rgba(74,222,128,0.12);  color: #4ade80;            border-color: rgba(74,222,128,0.25); }
    .dark-section .badge-selected{ background: rgba(96,165,250,0.12);  color: #60a5fa;            border-color: rgba(96,165,250,0.25); }
    .dark-section .badge-featured{ background: rgba(167,139,250,0.12); color: #a78bfa;            border-color: rgba(167,139,250,0.25); }
    .dark-section .badge-published{ background: rgba(167,139,250,0.12); color: #a78bfa;           border-color: rgba(167,139,250,0.25); }
    .dark-section .badge-funded  { background: rgba(74,222,128,0.12);  color: #4ade80;            border-color: rgba(74,222,128,0.25); }

    /* ─── Scroll Animation ──────────────────────────────── */
    .fade-in {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .fade-in.visible { opacity: 1; transform: none; }

    /* ─── NAV ────────────────────────────────────────────── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background var(--transition), backdrop-filter var(--transition), border-bottom var(--transition);
    }

    #nav.scrolled {
      background: rgba(10,8,6,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      transition: color var(--transition);
    }

    .nav-links a:hover { color: #fff; }

    .nav-links .nav-cta {
      color: #fff;
      background: var(--gold);
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      transition: background var(--transition), transform var(--transition);
    }

    .nav-links .nav-cta:hover { background: var(--gold-light); transform: translateY(-1px); }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: #fff;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* Mobile Menu */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(10,8,6,0.97);
      backdrop-filter: blur(24px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .mobile-menu.open {
      opacity: 1;
      pointer-events: all;
    }

    .mobile-menu a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: rgba(255,255,255,0.85);
      transition: color var(--transition);
    }

    .mobile-menu a:hover { color: var(--gold-light); }

    /* ─── HERO ───────────────────────────────────────────── */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/hero-stage.jpg');
      background-size: cover;
      background-position: center 30%;
      transform: scale(1.02);
      transition: transform 8s cubic-bezier(0.25,0.46,0.45,0.94);
      will-change: transform;
    }

    .hero-bg.loaded { transform: scale(1); }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10,8,6,0.96) 0%,
        rgba(10,8,6,0.65) 35%,
        rgba(10,8,6,0.15) 65%,
        transparent 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 6% 80px;
      max-width: 820px;
    }

    .hero-tag {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-light);
      border: 1px solid rgba(196,168,130,0.35);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 24px;
    }

    .hero-h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 400;
      color: #fff;
      line-height: 1.08;
      margin-bottom: 24px;
    }

    .hero-h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .hero-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      color: rgba(255,255,255,0.65);
      line-height: 1.7;
      max-width: 580px;
      margin-bottom: 36px;
    }

    .hero-cta {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 14px 30px;
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 32px rgba(157,126,90,0.35);
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .hero-cta:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(157,126,90,0.5);
    }

    /* ─── SECTION SHELL ─────────────────────────────────── */
    .section {
      padding: 100px 6%;
    }

    .section-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      margin-bottom: 56px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text);
    }

    .dark-section .section-title { color: #fff; }
    .dark-section .section-tag { color: var(--gold-light); background: rgba(196,168,130,0.08); border-color: rgba(196,168,130,0.2); }
    .dark-section .count-line { color: rgba(255,255,255,0.4); }

    /* ─── INTRO NARRATIVE ───────────────────────────────── */
    #intro { background: var(--bg-light); }

    .intro-body {
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    .intro-body .section-tag { display: block; text-align: center; }

    .intro-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 36px;
      color: var(--text);
    }

    .intro-para {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.85;
      margin-bottom: 20px;
    }

    .intro-para:last-child { margin-bottom: 0; }

    /* ─── PHOTO GRID ────────────────────────────────────── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }

    .photo-card {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    .photo-card:hover img { transform: scale(1.06); }

    .photo-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,8,6,0.85) 0%, transparent 55%);
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .photo-card:hover .photo-card-overlay { opacity: 1; }

    .photo-card-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: #fff;
      line-height: 1.4;
    }

    /* ─── ITEM LIST ─────────────────────────────────────── */
    .item-list { display: flex; flex-direction: column; gap: 12px; }

    .item-card {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .item-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .item-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--gold);
      min-width: 44px;
      padding-top: 2px;
    }

    .item-content { flex: 1; }

    .item-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .item-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .item-badge { padding-top: 2px; }

    /* Dark item cards */
    .dark-section .item-card {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.07);
      box-shadow: none;
    }

    .dark-section .item-card:hover {
      background: rgba(255,255,255,0.07);
      box-shadow: none;
      transform: translateY(-2px);
    }

    .dark-section .item-title { color: rgba(255,255,255,0.9); }
    .dark-section .item-sub   { color: rgba(255,255,255,0.45); }
    .dark-section .item-year  { color: var(--gold-light); }

    /* ─── DARK SECTION ─────────────────────────────────── */
    .dark-section {
      background: var(--bg-dark);
    }

    /* ─── RECOGNITION ───────────────────────────────────── */
    #recognition { background: var(--bg-light); }

    /* ─── COMPETITIONS ──────────────────────────────────── */
    #competitions { background: var(--bg-dark); }

    /* ─── ATOMBIOS ──────────────────────────────────────── */
    #atombios {
      background: var(--bg-dark);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .atombios-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .atombios-img {
      border-radius: var(--radius-card);
      overflow: hidden;
      aspect-ratio: 4/3;
    }

    .atombios-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) saturate(0.9);
      transition: filter var(--transition), transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    .atombios-img:hover img { filter: brightness(0.95) saturate(1); transform: scale(1.03); }

    .atombios-title {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      color: #fff;
      margin-bottom: 20px;
    }

    .atombios-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .atombios-features {
      list-style: none;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .atombios-features li {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.7);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .atombios-features li::before {
      content: '→';
      color: var(--gold-light);
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-demo {
      display: inline-block;
      background: transparent;
      border: 1px solid rgba(196,168,130,0.45);
      color: var(--gold-light);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 14px 30px;
      border-radius: var(--radius-pill);
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition);
    }

    .btn-demo:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ─── SPEAKING & MEDIA ──────────────────────────────── */
    #speaking { background: var(--bg-light); }

    .photo-grid-2x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }

    /* ─── EDUCATION ─────────────────────────────────────── */
    #education {
      background: var(--bg-light);
      border-top: 1px solid var(--border);
    }

    .affiliations {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .affil-pill {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(26,22,20,0.04);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
    }

    /* ─── CTA SECTION ───────────────────────────────────── */
    #cta-section {
      background: var(--bg-dark);
      text-align: center;
      padding: 120px 6%;
    }

    .cta-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      color: #fff;
      margin-bottom: 20px;
    }

    .cta-subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.75;
      max-width: 580px;
      margin: 0 auto 40px;
    }

    .cta-email-btn {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 16px 36px;
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 36px rgba(157,126,90,0.4);
      margin-bottom: 28px;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .cta-email-btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 14px 48px rgba(157,126,90,0.55);
    }

    .cta-socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .cta-socials a {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      transition: color var(--transition);
    }

    .cta-socials a:hover { color: var(--gold-light); }

    const nav = document.getElementById('nav');
    const onScroll = () => {
      nav.classList.toggle('scrolled', window.scrollY > 80);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // ─── Hamburger / mobile menu ─────────────────────────
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function closeMobileMenu() {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    mobileLinks.forEach(link => {
      link.addEventListener('click', closeMobileMenu);
    });

    // Close on Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMobileMenu();
    });

    // ─── Scroll-triggered fade-in ────────────────────────
    const fadeEls = document.querySelectorAll('.fade-in');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          // Stagger siblings in same parent
          const siblings = [...entry.target.parentElement.querySelectorAll('.fade-in')];
          const idx = siblings.indexOf(entry.target);
          const delay = idx * 80;
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -48px 0px' });

    fadeEls.forEach(el => observer.observe(el));

    // ─── Smooth anchor scroll ────────────────────────────
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', e => {
        const target = document.querySelector(anchor.getAttribute('href'));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>

</body>
</html>
